<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>G7 - Projeto Streaming de Vídeo | Arquitetura e Desenho de Software</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="GitPages do Grupo 06 - Projeto Streaming de Vídeo (Transmissões ao Vivo & UGC) - FGA0208 Arquitetura e Desenho de Software - UnB/FGA">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css">
  <style>
    :root { --theme-color: #6a1b9a; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section blockquote { border-left: 4px solid var(--theme-color); background: #faf7fd; }
  </style>
</head>
<body>
  <div id="app">Carregando...</div>
  <script>
    window.$docsify = {
      name: 'G7 · Streaming de Vídeo',
      repo: 'https://github.com/UnBArqDsw2026-2-Turma01/G7_LiveVideoStreaming',
      loadSidebar: true,
      markdown: {
        renderer: {
          code(code, lang) {
            if (lang === 'mermaid') {
              return '<div class="mermaid">' + code + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            if (window.mermaid) {
              mermaid.run({ querySelector: '.mermaid' });
            }
          });
        }
      ],
      subMaxLevel: 3,
      sidebarDisplayLevel: 1,
      auto2top: true,
      relativePath: true,
      search: {
        placeholder: 'Buscar na documentação...',
        noData: 'Nenhum resultado encontrado.',
        depth: 3
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false, theme: 'neutral' });</script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
